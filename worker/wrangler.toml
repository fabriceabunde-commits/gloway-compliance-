name = "gloway-compliance-api"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = false

# Set these non-secret vars after configuring Cloudflare Access:
# [vars]
# ALLOWED_ORIGIN = "https://compliance.gloway.trade"
# ACCESS_TEAM_DOMAIN = "your-team.cloudflareaccess.com"
# ACCESS_AUD = "your-access-application-audience-tag"
# ADMIN_EMAILS = "authorized-team@example.com"
#
# Create D1 and then uncomment and replace:
# [[d1_databases]]
# binding = "DB"
# database_name = "gloway-compliance"
# database_id = "REPLACE_WITH_D1_DATABASE_ID"
#
# Set TURNSTILE_SECRET via: npx wrangler secret put TURNSTILE_SECRET
# Do not commit secrets or live customer information.
